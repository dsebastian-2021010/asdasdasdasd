kind = "api"
  previewPath = "/api/v1"
  title = "Auth Service"

  [[services]]
  localPort = 5092
  name = "Auth Service"
  paths = ["/api/v1", "/swagger"]

  [services.env]
  ASPNETCORE_ENVIRONMENT = "Development"
  ASPNETCORE_URLS = "http://0.0.0.0:5092"

  [services.development]
  run = "dotnet run --project src/AuthService.Api/AuthService.Api.csproj --no-launch-profile"
  